<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · Mindleaf</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md topbar navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"
          ><img
            src="img/logo-nav.svg"
            width="30"
            height="30"
            class="me-2"
            alt=""
          />Mindleaf</a
        >
        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#m"
          aria-label="Menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="m">
          <ul class="navbar-nav ms-auto align-items-md-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html#features">Features</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#pricing">Pricing</a>
            </li>
            <li class="nav-item" id="authLinks">
              <a class="nav-link d-inline-block" href="login.html">Log in</a>
              <a class="btn btn-sm btn-light ms-md-2" href="signup.html"
                >Sign up</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card shadow-sm">
            <form class="card-body p-4" id="form">
              <h1 class="h3 mb-1">Start your free trial</h1>
              <p class="text-muted">14 days free. No payment details needed.</p>
              <div
                id="err"
                class="alert alert-danger d-none"
                role="alert"
              ></div>
              <div class="mb-3">
                <label class="form-label" for="name">Full name</label
                ><input
                  id="name"
                  class="form-control"
                  autocomplete="name"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email</label
                ><input
                  id="email"
                  type="email"
                  class="form-control"
                  autocomplete="username"
                  required
                />
              </div>
              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label class="form-label" for="password">Password</label
                  ><input
                    id="password"
                    type="password"
                    minlength="8"
                    class="form-control"
                    autocomplete="new-password"
                    required
                  />
                </div>
                <div class="col-sm-6">
                  <label class="form-label" for="confirm"
                    >Confirm password</label
                  ><input
                    id="confirm"
                    type="password"
                    class="form-control"
                    autocomplete="new-password"
                    required
                  />
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label" for="plan">Plan</label
                ><select id="plan" class="form-select">
                  <option value="Starter">Starter: $19 / month</option>
                  <option value="Professional">
                    Professional: $39 / month
                  </option>
                  <option value="Clinic">Clinic: $89 / month</option>
                </select>
              </div>
              <button class="btn btn-primary w-100">Create account</button>
              <p class="text-center small mt-4 mb-0">
                Already have an account? <a href="login.html">Log in</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/signup.js"></script>
  </body>
</html>
