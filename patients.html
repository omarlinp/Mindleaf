<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patients · Mindleaf</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4">
      <div
        class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3"
      >
        <h1 class="mb-0">Patients</h1>
        <div class="d-flex gap-2">
          <input
            id="q"
            class="form-control"
            type="search"
            placeholder="Search name, phone, concern"
            aria-label="Search patients"
          /><button class="btn btn-primary text-nowrap" onclick="openForm()">
            <i class="bi bi-plus-lg me-1"></i>Add patient
          </button>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Phone</th>
                <th>Presenting concern</th>
                <th>Appointments</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
      <div class="modal fade" id="modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <form class="modal-content" id="form">
            <div class="modal-header">
              <h5 class="modal-title" id="title">Add patient</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body row g-3">
              <input type="hidden" id="pid" />
              <div class="col-md-6">
                <label class="form-label" for="name">Full name</label
                ><input id="name" class="form-control" required />
              </div>
              <div class="col-md-3">
                <label class="form-label" for="dob">Date of birth</label
                ><input id="dob" type="date" class="form-control" required />
              </div>
              <div class="col-md-3">
                <label class="form-label" for="gender">Gender</label
                ><select id="gender" class="form-select">
                  <option>Female</option>
                  <option>Male</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="phone">Phone</label
                ><input id="phone" type="tel" class="form-control" required />
              </div>
              <div class="col-md-5">
                <label class="form-label" for="email">Email</label
                ><input id="email" type="email" class="form-control" />
              </div>
              <div class="col-md-3">
                <label class="form-label" for="referral">Referred by</label
                ><input id="referral" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="address">Address</label
                ><input id="address" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="emergency"
                  >Emergency contact</label
                ><input
                  id="emergency"
                  class="form-control"
                  placeholder="Name, phone"
                />
              </div>
              <div class="col-12">
                <label class="form-label" for="concern"
                  >Presenting concern</label
                ><input id="concern" class="form-control" />
              </div>
              <div class="col-12">
                <label class="form-label" for="notes">General notes</label
                ><textarea id="notes" rows="3" class="form-control"></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                Cancel</button
              ><button class="btn btn-primary">Save patient</button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/patients.js"></script>
  </body>
</html>
